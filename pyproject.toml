[project]
name = "omega13"
version = "2.4.2"
description = "Retroactive audio recorder and transcription daemon with optional TUI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "JACK-Client>=0.5.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.0",
    "requests>=2.31.0",
    "pyperclip>=1.8.0",
    "pynput>=1.7.6",
    "dbus-next>=0.2.3",
    "pygobject>=3.56.3",
    "pycairo>=1.29.1",
    "rich>=15.0.0",
]
[project.scripts]
omega13 = "omega13.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omega13"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
addopts = ""
